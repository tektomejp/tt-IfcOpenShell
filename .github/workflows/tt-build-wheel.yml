name: Build Python Wheel and Create Release

# Triggers on version tags only.
# Tag format: vX.Y.Z or vX.Y.Z.N (e.g., v0.8.5, v0.8.5.1)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version to embed in the wheel (e.g. 0.8.5). Leave empty to use latest tag."
        required: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
              VERSION="${{ github.event.inputs.version_override }}"
            else
              TAG=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || echo "v0.0.0")
              VERSION=${TAG#v}
            fi
            echo "Manual run, version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "Tag push: $TAG -> version $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.?[0-9]*$ ]]; then
            echo "::error::Tag format invalid. Expected vX.Y.Z or vX.Y.Z.N, got: $TAG"
            exit 1
          fi
          echo "Tag format valid: $TAG"

      - name: Check version is monotonically increasing
        if: github.event_name == 'push'
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          CURRENT_VERSION="${{ steps.version.outputs.version }}"

          # Only compare against tags that match our strict vX.Y.Z[.N] format.
          PREVIOUS_TAG=$(
            git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.?[0-9]*$' \
            | grep -v "^${CURRENT_TAG}$" \
            | sort -V \
            | tail -n 1
          )

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous version tags found. First release!"
            exit 0
          fi

          PREVIOUS_VERSION=${PREVIOUS_TAG#v}
          echo "Current:  $CURRENT_VERSION"
          echo "Previous: $PREVIOUS_VERSION"

          HIGHER=$(printf '%s\n%s' "$CURRENT_VERSION" "$PREVIOUS_VERSION" | sort -V | tail -n 1)
          if [ "$HIGHER" != "$CURRENT_VERSION" ]; then
            echo "::error::Version $CURRENT_VERSION is not greater than existing $PREVIOUS_VERSION"
            exit 1
          fi

          echo "Version check passed: $CURRENT_VERSION > $PREVIOUS_VERSION"

  build-wheel:
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-22.04, macos-15-intel, macos-15]
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            platform_tag: linux_x86_64
            macos_target: ""
          # macOS Intel (x86_64) — macos-15-intel replaces deprecated macos-13
          - os: macos-15-intel
            platform_tag: macosx_13_0_x86_64
            macos_target: "13.0"
          # macOS Apple Silicon (ARM64)
          - os: macos-15
            platform_tag: macosx_14_0_arm64
            macos_target: "14.0"
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive Python tag
        id: info
        run: |
          CPVER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          echo "cpver=cp${CPVER}" >> $GITHUB_OUTPUT
          echo "Python ${{ matrix.python-version }} -> cp${CPVER} | ${{ matrix.os }} (${{ matrix.platform_tag }})"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: build
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        shell: bash -el {0}
        run: |
          # Pin cgal-cpp>=5.6.2 to avoid CGAL bug #8313: operator bool() in
          # Halfedge_around_*_iterator calls this->base() which doesn't exist.
          # GCC silently skips it (unused template method), but Apple Clang 16+
          # (macOS 15) enforces two-phase name lookup and errors out.
          # Fixed in CGAL 5.6.2 by removing the broken operator bool() entirely.
          PKGS=(
            cmake ninja swig
            libboost-devel
            occt "cgal-cpp>=5.6.2"
            eigen gmp mpfr
            libxml2 nlohmann_json zlib
            "python=${{ matrix.python-version }}" numpy setuptools
          )

          # patchelf is only needed on Linux (used by auditwheel)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            PKGS+=(patchelf)
          fi

          conda install -y -c conda-forge "${PKGS[@]}"

      - name: Configure CMake
        shell: bash -el {0}
        run: |
          mkdir build && cd build

          CMAKE_EXTRA_ARGS=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export LDFLAGS="${LDFLAGS:-} -Wl,-flat_namespace,-undefined,suppress"
            CMAKE_EXTRA_ARGS+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}")
          fi

          cmake ../cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_IFCPYTHON=ON \
            -DBUILD_IFCGEOM=ON \
            -DBUILD_CONVERT=OFF \
            -DBUILD_GEOMSERVER=OFF \
            -DWITH_OPENCASCADE=ON \
            -DWITH_CGAL=ON \
            -DCOLLADA_SUPPORT=OFF \
            -DGLTF_SUPPORT=OFF \
            -DHDF5_SUPPORT=OFF \
            -DIFCXML_SUPPORT=ON \
            "-DSCHEMA_VERSIONS=2x3;4;4x3_add2" \
            "${CMAKE_EXTRA_ARGS[@]}"

      - name: Build C++ library
        shell: bash -el {0}
        run: |
          cd build

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export LDFLAGS="${LDFLAGS:-} -Wl,-flat_namespace,-undefined,suppress"
            JOBS=$(( $(sysctl -n hw.logicalcpu) / 2 + 1 ))
          else
            JOBS=$(( $(nproc) / 2 + 1 ))
          fi

          ninja -j"$JOBS"

      - name: Assemble wheel
        shell: bash -el {0}
        run: |
          PYTAG=${{ steps.info.outputs.cpver }}
          PYDIR=src/ifcopenshell-python/ifcopenshell
          DISTDIR=src/ifcopenshell-python/dist
          REPAIRED=src/ifcopenshell-python/repaired

          # Copy built C++ extension and SWIG wrapper into the Python package
          cp build/ifcwrap/_ifcopenshell_wrapper*.so "$PYDIR/"
          cp build/ifcwrap/ifcopenshell_wrapper.py   "$PYDIR/"

          # Stamp version (BSD sed on macOS, GNU sed on Linux)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' 's/^version = ".*"/version = "'"${VERSION}"'"/' \
              src/ifcopenshell-python/pyproject.toml
          else
            sed -i 's/^version = ".*"/version = "'"${VERSION}"'"/' \
              src/ifcopenshell-python/pyproject.toml
          fi

          # Build a pure-Python wheel, then retag as a platform wheel
          pip install build wheel
          python -m build --wheel src/ifcopenshell-python --outdir "$DISTDIR"
          wheel tags --remove \
            --python-tag="$PYTAG" --abi-tag="$PYTAG" \
            --platform-tag="${{ matrix.platform_tag }}" \
            "$DISTDIR"/*.whl

          # Bundle shared libraries into the wheel
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pip install auditwheel
            LD_LIBRARY_PATH="$CONDA_PREFIX/lib" \
              auditwheel repair "$DISTDIR"/*.whl -w "$REPAIRED"
            # Retag to generic linux_x86_64 so pip accepts any glibc
            wheel tags --remove \
              --platform-tag="${{ matrix.platform_tag }}" \
              "$REPAIRED"/*.whl
          else
            pip install delocate
            DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib" \
              delocate-wheel -w "$REPAIRED" -v "$DISTDIR"/*.whl
          fi

          echo "Final wheel:"
          ls -lh "$REPAIRED"/*.whl

      - name: Verify wheel installs and works
        shell: bash -el {0}
        run: |
          pip install src/ifcopenshell-python/repaired/*.whl
          python -c "
          import ifcopenshell
          print(f'version : {ifcopenshell.version}')
          print(f'schemas : {ifcopenshell.ifcopenshell_wrapper.schema_names()}')
          f = ifcopenshell.file(schema='IFC4')
          f.createIfcProject('smoke-test')
          print('Smoke test passed (${{ matrix.os }}, Python ${{ matrix.python-version }})')
          "

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ steps.info.outputs.cpver }}-${{ matrix.platform_tag }}
          path: src/ifcopenshell-python/repaired/*.whl
          retention-days: 90

  release:
    needs: [validate-tag, build-wheel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels

      - name: List wheels
        run: ls -lh wheels/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: wheels/*.whl
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## ifcopenshell ${{ env.VERSION }} (tt-IfcOpenShell fork)

            Self-contained wheels with bundled OCCT, CGAL dependencies.
            Built from commit ${{ github.sha }} with lazy loading support.

            ### Install (pick your platform and Python version)

            **Linux x86_64**
            ```
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp312-cp312-linux_x86_64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp313-cp313-linux_x86_64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp314-cp314-linux_x86_64.whl
            ```

            **macOS Intel (x86_64)**
            ```
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp312-cp312-macosx_13_0_x86_64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp313-cp313-macosx_13_0_x86_64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp314-cp314-macosx_13_0_x86_64.whl
            ```

            **macOS Apple Silicon (ARM64)**
            ```
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp312-cp312-macosx_14_0_arm64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp313-cp313-macosx_14_0_arm64.whl
            pip install https://github.com/tektomejp/tt-IfcOpenShell/releases/download/${{ needs.validate-tag.outputs.tag }}/ifcopenshell-${{ env.VERSION }}-cp314-cp314-macosx_14_0_arm64.whl
            ```

            ### Platforms
            - Linux x86_64, Python 3.12 / 3.13 / 3.14
            - macOS Intel (x86_64), Python 3.12 / 3.13 / 3.14
            - macOS Apple Silicon (ARM64), Python 3.12 / 3.13 / 3.14
            - Self-contained: OCCT, GMP, MPFR, libxml2 bundled inside
          token: ${{ secrets.GITHUB_TOKEN }}
